name: Deploy site

on:
  push:
    branches:
      - main
    paths:
      - docs/site/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish docs/site to gh-pages branch
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p /tmp/turbobuild-site
          cp -R docs/site/. /tmp/turbobuild-site/

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git switch gh-pages
            cp CNAME /tmp/turbobuild-cname 2>/dev/null || true
          else
            git switch --orphan gh-pages
          fi

          git rm -rf . >/dev/null 2>&1 || true
          cp -R /tmp/turbobuild-site/. .
          cp /tmp/turbobuild-cname CNAME 2>/dev/null || true
          touch .nojekyll

          git add .
          git commit -m "Deploy site from ${GITHUB_SHA}" || exit 0
          git push origin gh-pages
